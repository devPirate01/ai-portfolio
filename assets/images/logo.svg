      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#0b1f33" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#4ade80" />
